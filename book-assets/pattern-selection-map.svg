<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Choose a reasoning pattern by the problem that needs solving</title>
  <desc id="desc">A central design question branches by symptom: drifting meaning, infinite search, unsafe absence, repeated subproblems, opaque decisions, or representational duplicates, each pointing to a named pattern.</desc>
  <defs><style>
    .bg{fill:#FFF9E8}.core{fill:#2C657A;stroke:#17324D;stroke-width:3}.box{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.green{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}.gold{fill:#FFF4BF;stroke:#E2BA22;stroke-width:2}.rose{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}.blue{fill:#DDF7FB;stroke:#537487;stroke-width:2}
    .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 13px Georgia,serif}.light{fill:#FFFDF8;font:bold 16px Georgia,serif}.prose{fill:#405E70;font:13px Georgia,serif}.line{fill:none;stroke:#537487;stroke-width:2.5}
  </style></defs>
  <rect class="bg" width="900" height="460"/><text class="title" x="450" y="38" text-anchor="middle">A PATTERN STARTS WITH A NAMED DESIGN PROBLEM</text>
  <rect class="core" x="335" y="175" width="230" height="100" rx="18"/><text class="light" x="450" y="211" text-anchor="middle">WHAT IS GOING WRONG?</text><text class="light" x="450" y="243" text-anchor="middle">choose by consequence</text>
  <path class="line" d="M335 195L245 130M450 175V120M565 195L655 130M335 255L245 335M450 275V345M565 255L655 335"/>
  <rect class="green" x="25" y="75" width="245" height="100" rx="10"/><text class="prose" x="147" y="104" text-anchor="middle">meaning or argument roles drift</text><text class="label" x="147" y="140" text-anchor="middle">GROUND SENTENCE FIRST</text>
  <rect class="blue" x="325" y="65" width="250" height="85" rx="10"/><text class="prose" x="450" y="94" text-anchor="middle">recursive work repeats</text><text class="label" x="450" y="126" text-anchor="middle">TABLED CLOSURE</text>
  <rect class="gold" x="630" y="75" width="245" height="100" rx="10"/><text class="prose" x="752" y="104" text-anchor="middle">absence is being inferred</text><text class="label" x="752" y="140" text-anchor="middle">CLOSED BOUNDARY</text>
  <rect class="rose" x="25" y="305" width="245" height="100" rx="10"/><text class="prose" x="147" y="334" text-anchor="middle">search is unbounded</text><text class="label" x="147" y="365" text-anchor="middle">FINITE GENERATOR</text><text class="label" x="147" y="385" text-anchor="middle">+ DECREASING MEASURE</text>
  <rect class="green" x="325" y="330" width="250" height="85" rx="10"/><text class="prose" x="450" y="359" text-anchor="middle">a decision is opaque</text><text class="label" x="450" y="391" text-anchor="middle">PROOF-CARRYING ANSWER</text>
  <rect class="blue" x="630" y="305" width="245" height="100" rx="10"/><text class="prose" x="752" y="334" text-anchor="middle">equivalent forms duplicate work</text><text class="label" x="752" y="365" text-anchor="middle">CANONICAL</text><text class="label" x="752" y="385" text-anchor="middle">REPRESENTATION</text>
  <text class="prose" x="450" y="445" text-anchor="middle">Patterns are reviewable tradeoffs among meaning, representation, modes, and control.</text>
</svg>
