<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">A relational theory needs more than single input-output tests</title>
  <desc id="desc">A public relation sits at the center of a test spectrum covering meaning, modes, finite properties, metamorphic changes, proof provenance, integrity, and scale.</desc>
  <defs><style>
    .bg{fill:#FFF9E8}.core{fill:#2C657A;stroke:#17324D;stroke-width:3}.box{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.green{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}.gold{fill:#FFF4BF;stroke:#E2BA22;stroke-width:2}.rose{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}.blue{fill:#DDF7FB;stroke:#537487;stroke-width:2}
    .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 13px Georgia,serif}.light{fill:#FFFDF8;font:bold 16px Georgia,serif}.prose{fill:#405E70;font:13px Georgia,serif}.line{fill:none;stroke:#537487;stroke-width:2.5}
  </style></defs>
  <rect class="bg" width="900" height="460"/><text class="title" x="450" y="38" text-anchor="middle">TEST THE RELATION, NOT JUST ONE CALL</text>
  <rect class="core" x="340" y="170" width="220" height="105" rx="18"/><text class="light" x="450" y="207" text-anchor="middle">PUBLIC RELATION</text><text class="light" x="450" y="241" text-anchor="middle">path/2 contract</text>
  <path class="line" d="M340 190L230 125M450 170V105M560 190L670 125M340 250L230 335M450 275V355M560 250L670 335"/>
  <rect class="green" x="35" y="70" width="220" height="100" rx="10"/><text class="label" x="145" y="100" text-anchor="middle">MEANING CASES</text><text class="prose" x="145" y="130" text-anchor="middle">positive · absent · boundary</text><text class="prose" x="145" y="152" text-anchor="middle">cycle · disputed reflexivity</text>
  <rect class="blue" x="340" y="60" width="220" height="80" rx="10"/><text class="label" x="450" y="91" text-anchor="middle">SUPPORTED MODES</text><text class="prose" x="450" y="119" text-anchor="middle">construct · enumerate · check</text>
  <rect class="gold" x="645" y="70" width="220" height="100" rx="10"/><text class="label" x="755" y="100" text-anchor="middle">FINITE PROPERTIES</text><text class="prose" x="755" y="130" text-anchor="middle">round trip · invariant</text><text class="prose" x="755" y="152" text-anchor="middle">reference agreement</text>
  <rect class="box" x="35" y="305" width="220" height="100" rx="10"/><text class="label" x="145" y="335" text-anchor="middle">METAMORPHIC CHANGE</text><text class="prose" x="145" y="365" text-anchor="middle">transform input; predict</text><text class="prose" x="145" y="387" text-anchor="middle">the relation between runs</text>
  <rect class="rose" x="340" y="325" width="220" height="80" rx="10"/><text class="label" x="450" y="356" text-anchor="middle">INTEGRITY + FAILURE</text><text class="prose" x="450" y="384" text-anchor="middle">no answer ≠ invalid input ≠ warning</text>
  <rect class="green" x="645" y="305" width="220" height="100" rx="10"/><text class="label" x="755" y="335" text-anchor="middle">PROOF + SCALE</text><text class="prose" x="755" y="365" text-anchor="middle">premises remain intended;</text><text class="prose" x="755" y="387" text-anchor="middle">finite behavior remains usable</text>
  <text class="prose" x="450" y="445" text-anchor="middle">Different observers protect different promises; no single golden covers the whole relation.</text>
</svg>
