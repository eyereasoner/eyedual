<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Text becomes structured context without becoming global fact</title>
  <desc id="desc">Raw text is normalized into a message context. An ordinary relation inspects members inside that context, while a boundary prevents those members from becoming ambient facts.</desc>
  <defs><style>
    .bg{fill:#FFF9E8}.paper{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.ctx{fill:#DDF7FB;stroke:#008EAA;stroke-width:3}.warn{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}
    .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 17px Georgia,serif}.code{fill:#102A3A;font:14px ui-monospace,monospace}.prose{fill:#405E70;font:15px Georgia,serif}.line{fill:none;stroke:#537487;stroke-width:3}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#537487"/></marker></defs>
  <rect class="bg" width="900" height="430"/><text class="title" x="450" y="38" text-anchor="middle">STRUCTURE TEXT AT THE MODEL BOUNDARY</text>
  <rect class="paper" x="30" y="105" width="210" height="150" rx="10"/><text class="label" x="135" y="138" text-anchor="middle">RAW INPUT</text><text class="code" x="135" y="178" text-anchor="middle">" TEMP 91 "</text><text class="prose" x="135" y="215" text-anchor="middle">trim · normalize · parse</text>
  <path class="line" marker-end="url(#a)" d="M240 180H292"/>
  <rect class="ctx" x="300" y="75" width="330" height="220" rx="16"/><text class="label" x="465" y="110" text-anchor="middle">MESSAGE CONTEXT · event_17</text><rect class="paper" x="340" y="135" width="250" height="38" rx="18"/><text class="code" x="465" y="159" text-anchor="middle">severity(high)</text><rect class="paper" x="340" y="183" width="250" height="38" rx="18"/><text class="code" x="465" y="207" text-anchor="middle">source(sensor_3)</text><rect class="paper" x="340" y="231" width="250" height="38" rx="18"/><text class="code" x="465" y="255" text-anchor="middle">reading(temp,91)</text>
  <path class="line" marker-end="url(#a)" d="M630 185H680"/><rect class="paper" x="688" y="105" width="182" height="150" rx="10"/><text class="label" x="779" y="138" text-anchor="middle">INSPECT</text><text class="code" x="779" y="178" text-anchor="middle">context_member/2</text><text class="prose" x="779" y="211" text-anchor="middle">walks members</text><text class="prose" x="779" y="233" text-anchor="middle">inside this message</text>
  <path d="M285 315H645" stroke="#C8A100" stroke-width="3" stroke-dasharray="8 6"/><text class="label" x="465" y="340" text-anchor="middle">CONTEXT BOUNDARY</text>
  <rect class="warn" x="245" y="360" width="440" height="45" rx="9"/><text class="code" x="465" y="388" text-anchor="middle">inspection ≠ asserting severity(high) globally</text>
</svg>
