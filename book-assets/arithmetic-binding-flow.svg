<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Binding values before arithmetic</title>
  <desc id="desc">A finite generator binds N, arithmetic computes its square, and a comparison filters the result; reversing the first two steps leaves arithmetic without an input.</desc>
  <defs><style>
    .bg{fill:#FFF9E8}.box{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.green{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}.gold{fill:#FFF4BF;stroke:#E2BA22;stroke-width:2}.rose{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}
    .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 17px Georgia,serif}.code{fill:#102A3A;font:15px ui-monospace,monospace}.prose{fill:#405E70;font:15px Georgia,serif}.line{fill:none;stroke:#537487;stroke-width:3}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#537487"/></marker></defs>
  <rect class="bg" width="900" height="420"/><text class="title" x="450" y="38" text-anchor="middle">ARITHMETIC RUNS ON BOUND VALUES</text>
  <rect class="green" x="45" y="95" width="220" height="150" rx="12"/><text class="label" x="155" y="128" text-anchor="middle">1 · GENERATE</text><text class="code" x="155" y="166" text-anchor="middle">between(1,10,N)</text><text class="prose" x="155" y="202" text-anchor="middle">binds N to one finite</text><text class="prose" x="155" y="225" text-anchor="middle">candidate at a time</text>
  <rect class="gold" x="340" y="95" width="220" height="150" rx="12"/><text class="label" x="450" y="128" text-anchor="middle">2 · COMPUTE</text><text class="code" x="450" y="166" text-anchor="middle">S is N * N</text><text class="prose" x="450" y="202" text-anchor="middle">reads bound N</text><text class="prose" x="450" y="225" text-anchor="middle">and binds S</text>
  <rect class="box" x="635" y="95" width="220" height="150" rx="12"/><text class="label" x="745" y="128" text-anchor="middle">3 · FILTER</text><text class="code" x="745" y="166" text-anchor="middle">S =&lt; 64</text><text class="prose" x="745" y="202" text-anchor="middle">keeps or rejects</text><text class="prose" x="745" y="225" text-anchor="middle">a ground candidate</text>
  <path class="line" marker-end="url(#a)" d="M265 170H332"/><text class="code" x="299" y="155" text-anchor="middle">N</text><path class="line" marker-end="url(#a)" d="M560 170H627"/><text class="code" x="594" y="155" text-anchor="middle">N,S</text>
  <rect class="rose" x="210" y="300" width="480" height="72" rx="10"/><text class="label" x="450" y="327" text-anchor="middle">ORDER IS A READINESS CONTRACT</text><text class="code" x="450" y="354" text-anchor="middle">S is N*N  before  between(...)  →  N is not ready</text>
  <text class="prose" x="450" y="402" text-anchor="middle">The logical relation may be simple; the operational mode says which values must already exist.</text>
</svg>
