<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">A workbench for transforming logic programs</title>
  <desc id="desc">A source relation can be unfolded, folded, specialized, or given an accumulator, but each transformed program must be checked for answers, modes, termination, proof shape, and search cost.</desc>
  <defs>
    <style>
      .paper{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.source{fill:#17324D;stroke:#102A3A;stroke-width:3}
      .green{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}.gold{fill:#FFF4BF;stroke:#E2BA22;stroke-width:2}
      .rose{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}.blue{fill:#DDF7FB;stroke:#537487;stroke-width:2}
      .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 17px Georgia,serif}
      .prose{fill:#405E70;font:15px Georgia,serif}.code{fill:#102A3A;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}
      .light{fill:#DDF7FB;font:15px ui-monospace,SFMono-Regular,Consolas,monospace}.line{fill:none;stroke:#537487;stroke-width:2.5}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#537487"/></marker>
  </defs>
  <rect width="900" height="500" fill="#FFF9E8"/>
  <text class="title" x="450" y="35" text-anchor="middle">THE TRANSFORMATION WORKBENCH</text>
  <rect class="source" x="315" y="75" width="270" height="115" rx="12"/>
  <text class="light" x="450" y="108" text-anchor="middle">original relation</text>
  <text class="light" x="450" y="140" text-anchor="middle">meaning + supported modes</text>
  <text class="light" x="450" y="168" text-anchor="middle">answers · proofs · control</text>
  <path class="line" marker-end="url(#arrow)" d="M365 190C320 205 240 210 150 228"/>
  <path class="line" marker-end="url(#arrow)" d="M420 190C405 205 385 212 360 228"/>
  <path class="line" marker-end="url(#arrow)" d="M480 190C500 205 535 212 560 228"/>
  <path class="line" marker-end="url(#arrow)" d="M535 190C600 205 700 210 762 228"/>

  <rect class="green" x="45" y="235" width="210" height="115" rx="10"/>
  <text class="label" x="150" y="267" text-anchor="middle">UNFOLD</text>
  <text class="prose" x="150" y="297" text-anchor="middle">replace a call</text>
  <text class="prose" x="150" y="320" text-anchor="middle">with defining bodies</text>
  <rect class="gold" x="270" y="235" width="180" height="115" rx="10"/>
  <text class="label" x="360" y="267" text-anchor="middle">FOLD</text>
  <text class="prose" x="360" y="297" text-anchor="middle">name a repeated</text>
  <text class="prose" x="360" y="320" text-anchor="middle">shared conjunction</text>
  <rect class="blue" x="465" y="235" width="190" height="115" rx="10"/>
  <text class="label" x="560" y="267" text-anchor="middle">SPECIALIZE</text>
  <text class="prose" x="560" y="297" text-anchor="middle">fix known arguments;</text>
  <text class="prose" x="560" y="320" text-anchor="middle">remove irrelevant paths</text>
  <rect class="rose" x="670" y="235" width="185" height="115" rx="10"/>
  <text class="label" x="762" y="267" text-anchor="middle">ACCUMULATE</text>
  <text class="prose" x="762" y="297" text-anchor="middle">carry a partial result</text>
  <text class="prose" x="762" y="320" text-anchor="middle">through recursion</text>

  <path class="line" marker-end="url(#arrow)" d="M150 350C205 378 275 382 335 393"/>
  <path class="line" marker-end="url(#arrow)" d="M360 350L400 393"/>
  <path class="line" marker-end="url(#arrow)" d="M560 350L505 393"/>
  <path class="line" marker-end="url(#arrow)" d="M762 350C700 378 625 382 565 393"/>
  <rect class="paper" x="200" y="400" width="500" height="67" rx="10"/>
  <text class="label" x="450" y="427" text-anchor="middle">COMPARE THE CONTRACT</text>
  <text class="code" x="450" y="453" text-anchor="middle">answers · modes · termination · order · proofs · cost</text>
  <text class="prose" x="450" y="490" text-anchor="middle">A faster clause is only equivalent inside a stated observational boundary.</text>
</svg>
