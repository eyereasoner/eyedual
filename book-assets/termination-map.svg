<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Three different termination arguments</title>
  <desc id="desc">Recursive calls may terminate because a structural measure decreases, because finite tabled calls reach a fixed point, or fail to terminate because terms grow without bound.</desc>
  <defs><style>
    .bg{fill:#FFF9E8}.good{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}.table{fill:#DDF7FB;stroke:#537487;stroke-width:2}.bad{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}
    .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 15px Georgia,serif}.code{fill:#102A3A;font:14px ui-monospace,monospace}.prose{fill:#405E70;font:15px Georgia,serif}.line{fill:none;stroke:#537487;stroke-width:2.5}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#537487"/></marker></defs>
  <rect class="bg" width="900" height="440"/><text class="title" x="450" y="38" text-anchor="middle">ASK WHAT MAKES THE CALL SPACE FINITE</text>
  <rect class="good" x="30" y="80" width="260" height="285" rx="12"/><text class="label" x="160" y="115" text-anchor="middle">DECREASING STRUCTURE</text><text class="code" x="160" y="155" text-anchor="middle">[a,b,c] → [b,c]</text><text class="code" x="160" y="190" text-anchor="middle">→ [c] → []</text><path class="line" marker-end="url(#a)" d="M160 210V250"/><text class="prose" x="160" y="280" text-anchor="middle">well-founded measure:</text><text class="code" x="160" y="306" text-anchor="middle">list length ↓</text><text class="label" x="160" y="345" text-anchor="middle">TERMINATES</text>
  <rect class="table" x="320" y="80" width="260" height="285" rx="12"/><text class="label" x="450" y="115" text-anchor="middle">FINITE TABLED DOMAIN</text><text class="code" x="450" y="155" text-anchor="middle">path(a, ?)</text><text class="code" x="450" y="188" text-anchor="middle">{b,c,d}</text><path class="line" marker-end="url(#a)" d="M450 210V250"/><text class="prose" x="450" y="280" text-anchor="middle">repeated calls reuse</text><text class="code" x="450" y="306" text-anchor="middle">fixed-point answers</text><text class="label" x="450" y="345" text-anchor="middle">TERMINATES</text>
  <rect class="bad" x="610" y="80" width="260" height="285" rx="12"/><text class="label" x="740" y="115" text-anchor="middle">GROWING TERMS</text><text class="code" x="740" y="150" text-anchor="middle">grows(X)</text><text class="code" x="740" y="180" text-anchor="middle">grows(w(X))</text><text class="code" x="740" y="210" text-anchor="middle">grows(w(w(X)))</text><path class="line" marker-end="url(#a)" d="M740 225V260"/><text class="prose" x="740" y="286" text-anchor="middle">every call is new;</text><text class="code" x="740" y="312" text-anchor="middle">tabling cannot close it</text><text class="label" x="740" y="345" text-anchor="middle">UNBOUNDED</text>
  <text class="prose" x="450" y="410" text-anchor="middle">Tabling is reuse, not a universal termination spell.</text>
</svg>
