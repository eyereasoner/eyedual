<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Finite search as experimental mathematics</title>
  <desc id="desc">A universal conjecture is restricted to a declared finite domain. Search either returns a counterexample, which refutes the conjecture, or exhausts the box, which supplies bounded evidence but not a universal proof.</desc>
  <defs><style>
    .bg{fill:#FFF9E8}.paper{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.domain{fill:#DDF7FB;stroke:#537487;stroke-width:3}.bad{fill:#FFF0D6;stroke:#C8A100;stroke-width:2}.good{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}
    .title{fill:#C8A100;font:bold 24px Georgia,serif}.label{fill:#17324D;font:bold 17px Georgia,serif}.code{fill:#102A3A;font:14px ui-monospace,monospace}.prose{fill:#405E70;font:15px Georgia,serif}.line{fill:none;stroke:#537487;stroke-width:3}
  </style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#537487"/></marker></defs>
  <rect class="bg" width="900" height="440"/><text class="title" x="450" y="38" text-anchor="middle">FINITE SEARCH: REFUTATION AND BOUNDED EVIDENCE</text>
  <rect class="paper" x="30" y="125" width="210" height="125" rx="10"/><text class="label" x="135" y="158" text-anchor="middle">CONJECTURE</text><text class="code" x="135" y="198" text-anchor="middle">∀ n . P(n)</text><text class="prose" x="135" y="227" text-anchor="middle">a universal claim</text>
  <path class="line" marker-end="url(#a)" d="M240 187H292"/><rect class="domain" x="300" y="75" width="300" height="250" rx="16"/><text class="label" x="450" y="110" text-anchor="middle">DECLARED FINITE DOMAIN</text><text class="code" x="450" y="145" text-anchor="middle">between(-100,100,n)</text><circle cx="380" cy="205" r="12" fill="#008EAA"/><circle cx="425" cy="235" r="12" fill="#008EAA"/><circle cx="480" cy="185" r="12" fill="#008EAA"/><circle cx="530" cy="245" r="12" fill="#C8A100"/><text class="prose" x="450" y="295" text-anchor="middle">test every generated point</text>
  <path class="line" marker-end="url(#a)" d="M600 150C645 135 650 125 680 125"/><rect class="bad" x="688" y="75" width="182" height="125" rx="10"/><text class="label" x="779" y="108" text-anchor="middle">FOUND n</text><text class="code" x="779" y="145" text-anchor="middle">¬ P(n)</text><text class="prose" x="779" y="175" text-anchor="middle">global refutation</text>
  <path class="line" marker-end="url(#a)" d="M600 260C645 275 650 290 680 290"/><rect class="good" x="688" y="240" width="182" height="125" rx="10"/><text class="label" x="779" y="273" text-anchor="middle">NONE FOUND</text><text class="code" x="779" y="310" text-anchor="middle">P(-100..100)</text><text class="prose" x="779" y="340" text-anchor="middle">bounded evidence</text>
  <text class="prose" x="450" y="410" text-anchor="middle">Exhaustion proves the bounded statement—not the unbounded theorem.</text>
</svg>
