<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1450" viewBox="0 0 1000 1450"
     role="img" aria-labelledby="title desc">
  <title id="title">The Art of WebEntail</title>
  <desc id="desc">Editable SVG cover for The Art of WebEntail. All text is live text and kept within its surrounding boxes.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#f3ead9"/>
    </linearGradient>
    <style>
      .bg { fill: url(#paper); }
      .navy { fill: #233a59; }
      .green { fill: #2f7d63; }
      .wine { fill: #94493f; }
      .gold { fill: #b7904f; }
      .cream { fill: #fffdf8; }
      .navy-stroke { stroke: #233a59; fill: none; }
      .green-stroke { stroke: #2f7d63; fill: none; }
      .wine-stroke { stroke: #94493f; fill: none; }
      .gold-stroke { stroke: #b7904f; fill: none; }
      .thin { stroke-width: 2; }
      .mid { stroke-width: 3; }
      .thick { stroke-width: 5; }
      .round { stroke-linecap: round; stroke-linejoin: round; }
      .title1 { fill:#233a59; font-family: Georgia, 'Times New Roman', serif; font-size:64px; font-weight:500; }
      .title2 { font-family: Georgia, 'Times New Roman', serif; font-size:118px; font-weight:700; letter-spacing:-4px; }
      .subtitle { fill:#2f7d63; font-family: Georgia, 'Times New Roman', serif; font-size:28px; }
      .author { fill:#94493f; font-family: Georgia, 'Times New Roman', serif; font-size:25px; }
      .section { font-family: Georgia, 'Times New Roman', serif; font-size:20px; font-weight:700; letter-spacing:2px; }
      .smallserif { font-family: Georgia, 'Times New Roman', serif; font-size:18px; }
      .paneltitle { font-family: Georgia, 'Times New Roman', serif; font-size:21px; font-weight:700; letter-spacing:0.4px; }
      .code { fill:#233a59; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:18px; }
      .codesm { fill:#233a59; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:15px; }
      .label { fill:#233a59; font-family: Georgia, 'Times New Roman', serif; font-size:21px; }
      .node { fill:#fffdf8; stroke:#233a59; stroke-width:3; }
      .rdfnode { fill:#7ea88f; stroke:#2f7d63; stroke-width:3; }
      .panel { fill:#fffdf8; fill-opacity:0.96; stroke-width:3.5; }
      .softbox { fill:#f4f7f1; stroke:#233a59; stroke-width:2.2; }
    </style>
  </defs>

  <rect width="1000" height="1450" class="bg"/>

  <!-- header -->
  <g id="header">
    <text x="500" y="105" text-anchor="middle" class="title1">The Art of</text>
    <text x="500" y="238" text-anchor="middle" class="title2">
      <tspan fill="#233a59">Web</tspan><tspan fill="#94493f">Entail</tspan>
    </text>

    <line x1="110" y1="274" x2="445" y2="274" class="gold-stroke thin round"/>
    <path d="M500 265 L509 274 L500 283 L491 274 Z" class="gold"/>
    <line x1="555" y1="274" x2="890" y2="274" class="gold-stroke thin round"/>

    <text x="500" y="325" text-anchor="middle" class="subtitle">Standards-based relations, search, and explanations</text>

    <line x1="300" y1="372" x2="405" y2="372" class="gold-stroke thin round"/>
    <text x="500" y="381" text-anchor="middle" class="author">Jos De Roo</text>
    <line x1="595" y1="372" x2="700" y2="372" class="gold-stroke thin round"/>
  </g>

  <!-- upper labels -->
  <g id="labels">
    <text x="210" y="455" text-anchor="middle" class="section wine">RELATIONS</text>
    <text x="210" y="480" text-anchor="middle" class="smallserif wine">(LOGIC)</text>
    <text x="790" y="455" text-anchor="middle" class="section green">LINKED DATA</text>
    <text x="790" y="480" text-anchor="middle" class="smallserif green">(RDF)</text>
  </g>

  <!-- hero diagrams -->
  <g id="logic-graph">
    <line x1="145" y1="610" x2="210" y2="540" class="green-stroke mid round"/>
    <line x1="210" y1="540" x2="275" y2="610" class="green-stroke mid round"/>
    <line x1="145" y1="610" x2="275" y2="610" class="green-stroke mid round"/>
    <circle cx="210" cy="540" r="28" class="node"/>
    <circle cx="145" cy="610" r="28" class="node"/>
    <circle cx="275" cy="610" r="28" class="node"/>
    <text x="210" y="548" text-anchor="middle" class="label">a</text>
    <text x="145" y="618" text-anchor="middle" class="label">b</text>
    <text x="275" y="618" text-anchor="middle" class="label">c</text>
  </g>

  <g id="rdf-graph">
    <line x1="735" y1="535" x2="805" y2="575" class="green-stroke mid round"/>
    <line x1="805" y1="575" x2="765" y2="640" class="green-stroke mid round"/>
    <line x1="805" y1="575" x2="875" y2="610" class="green-stroke mid round"/>
    <line x1="765" y1="640" x2="835" y2="690" class="green-stroke mid round"/>
    <circle cx="735" cy="535" r="17" class="rdfnode"/>
    <circle cx="805" cy="575" r="17" class="rdfnode"/>
    <circle cx="765" cy="640" r="17" class="rdfnode"/>
    <circle cx="875" cy="610" r="17" class="rdfnode"/>
    <circle cx="835" cy="690" r="17" class="rdfnode"/>

    <rect x="748" y="500" width="116" height="40" rx="8" fill="#fff8ea" stroke="#233a59" stroke-width="2"/>
    <text x="806" y="526" text-anchor="middle" class="smallserif navy">ex:Alice</text>

    <rect x="855" y="558" width="118" height="40" rx="8" fill="#fff8ea" stroke="#233a59" stroke-width="2"/>
    <text x="914" y="584" text-anchor="middle" class="smallserif navy">ex:knows</text>

    <rect x="846" y="682" width="106" height="40" rx="8" fill="#fff8ea" stroke="#233a59" stroke-width="2"/>
    <text x="899" y="708" text-anchor="middle" class="smallserif navy">ex:Bob</text>
  </g>

  <!-- abstract bridge -->
  <g id="bridge">
    <path d="M320 710 C338 560, 410 500, 500 500 C590 500, 662 560, 680 710"
          fill="none" stroke="#debf85" stroke-width="62" stroke-linecap="round"/>
    <path d="M320 710 C338 560, 410 500, 500 500 C590 500, 662 560, 680 710"
          class="navy-stroke mid round"/>

    <path d="M448 492 L552 492 L565 548 L435 548 Z" fill="#f0ddb5" stroke="#233a59" stroke-width="3"/>
    <text x="500" y="527" text-anchor="middle" class="section navy" style="font-size:18px; letter-spacing:1px;">ENTAILMENT</text>

    <rect x="290" y="690" width="68" height="148" rx="7" fill="#ead6a8" stroke="#233a59" stroke-width="3"/>
    <rect x="278" y="676" width="92" height="22" rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
    <rect x="276" y="830" width="96" height="24" rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
    <line x1="306" y1="708" x2="306" y2="824" class="gold-stroke thin"/>
    <line x1="342" y1="708" x2="342" y2="824" class="gold-stroke thin"/>

    <rect x="642" y="690" width="68" height="148" rx="7" fill="#ead6a8" stroke="#233a59" stroke-width="3"/>
    <rect x="630" y="676" width="92" height="22" rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
    <rect x="628" y="830" width="96" height="24" rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
    <line x1="658" y1="708" x2="658" y2="824" class="gold-stroke thin"/>
    <line x1="694" y1="708" x2="694" y2="824" class="gold-stroke thin"/>
  </g>

  <!-- proof tree -->
  <g id="proof-tree">
    <circle cx="500" cy="590" r="18" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="455" cy="660" r="18" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="545" cy="660" r="18" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="420" cy="730" r="18" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="500" cy="730" r="18" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="580" cy="730" r="18" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <path d="M500 608 L455 642 M500 608 L545 642 M455 678 L420 712 M455 678 L500 712 M545 678 L580 712"
          class="green-stroke mid round"/>
    <line x1="500" y1="752" x2="500" y2="790" class="green-stroke mid round" stroke-dasharray="4 8"/>
    <path d="M491 785 L500 796 L509 785" class="green-stroke mid round"/>
    <circle cx="500" cy="824" r="29" fill="#2f7d63" stroke="#233a59" stroke-width="3"/>
    <path d="M486 825 L497 836 L516 810" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="70" y1="875" x2="930" y2="875" class="gold-stroke thin"/>
  <circle cx="500" cy="875" r="6" class="gold"/>

  <!-- panels -->
  <g id="panel1">
    <rect x="45" y="925" width="280" height="360" rx="28" class="panel" stroke="#94493f"/>
    <circle cx="185" cy="925" r="38" fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
    <circle cx="185" cy="908" r="7" fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
    <circle cx="166" cy="942" r="7" fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
    <circle cx="204" cy="942" r="7" fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
    <path d="M185 915 L166 935 M185 915 L204 935 M166 942 L204 942" class="wine-stroke mid round"/>
    <text x="185" y="990" text-anchor="middle" class="paneltitle wine">1. RELATION GRAPH</text>

    <line x1="105" y1="1045" x2="160" y2="1100" class="green-stroke mid round"/>
    <line x1="160" y1="1100" x2="225" y2="1060" class="green-stroke mid round"/>
    <line x1="225" y1="1060" x2="268" y2="1128" class="green-stroke mid round" stroke-dasharray="6 6"/>
    <circle cx="105" cy="1045" r="21" class="node"/>
    <circle cx="160" cy="1100" r="21" class="node"/>
    <circle cx="225" cy="1060" r="21" class="node"/>
    <circle cx="268" cy="1128" r="21" class="node"/>
    <text x="105" y="1052" text-anchor="middle" class="label">a</text>
    <text x="160" y="1107" text-anchor="middle" class="label">b</text>
    <text x="225" y="1067" text-anchor="middle" class="label">c</text>
    <text x="268" y="1135" text-anchor="middle" class="label">d</text>

    <text x="82" y="1188" class="codesm">path(a, b).</text>
    <text x="82" y="1217" class="codesm">path(b, c).</text>
    <text x="82" y="1246" class="codesm">edge(c, d).</text>
  </g>

  <g id="panel2">
    <rect x="340" y="925" width="320" height="360" rx="28" class="panel" stroke="#2f7d63"/>
    <circle cx="500" cy="925" r="38" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <text x="500" y="936" text-anchor="middle" class="code green" style="font-size:28px">&lt;/&gt;</text>
    <text x="500" y="990" text-anchor="middle" class="paneltitle green">2. EXECUTABLE CLAUSES</text>

    <text x="375" y="1045" class="code">path(X, Y) :- edge(X, Y).</text>
    <text x="375" y="1095" class="code">path(X, Y) :-</text>
    <text x="415" y="1128" class="code">edge(X, Z),</text>
    <text x="415" y="1161" class="code">path(Z, Y).</text>

    <rect x="376" y="1208" width="248" height="44" rx="8" fill="#f4f7f1" stroke="#2f7d63" stroke-width="2"/>
    <text x="500" y="1228" text-anchor="middle" class="codesm">webentail --goal</text>
    <text x="500" y="1245" text-anchor="middle" class="codesm">'path(a, X)' program.pl</text>

    <circle cx="390" cy="1268" r="14" fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <path d="M383 1268 L389 1274 L398 1260" fill="none" stroke="#2f7d63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="412" y="1274" class="codesm" style="font-size:14px; fill:#2f7d63;">answers and proofs agree</text>
  </g>

  <g id="panel3">
    <rect x="675" y="925" width="280" height="360" rx="28" class="panel" stroke="#233a59"/>
    <circle cx="815" cy="925" r="38" fill="#fffdf8" stroke="#233a59" stroke-width="3"/>
    <rect x="807" y="903" width="16" height="12" rx="2" fill="#fffdf8" stroke="#233a59" stroke-width="2"/>
    <rect x="790" y="934" width="16" height="12" rx="2" fill="#fffdf8" stroke="#233a59" stroke-width="2"/>
    <rect x="824" y="934" width="16" height="12" rx="2" fill="#fffdf8" stroke="#233a59" stroke-width="2"/>
    <path d="M815 915 V926 M798 926 H832 M798 926 V934 M832 926 V934" class="navy-stroke thin round"/>
    <text x="815" y="990" text-anchor="middle" class="paneltitle navy">3. SYNTAX &amp; PROOFS</text>

    <rect x="758" y="1038" width="114" height="38" rx="8" class="softbox"/>
    <text x="815" y="1062" text-anchor="middle" class="codesm">path(a, X)</text>

    <rect x="700" y="1122" width="104" height="38" rx="8" class="softbox"/>
    <rect x="826" y="1122" width="104" height="38" rx="8" class="softbox"/>
    <text x="752" y="1146" text-anchor="middle" class="codesm">edge(a,b)</text>
    <text x="878" y="1146" text-anchor="middle" class="codesm">path(b,X)</text>

    <rect x="824" y="1206" width="106" height="38" rx="8" class="softbox"/>
    <text x="877" y="1230" text-anchor="middle" class="codesm">edge(b,c)</text>

    <path d="M815 1076 L752 1122 M815 1076 L878 1122 M878 1160 L877 1206" class="navy-stroke mid round"/>
    <text x="877" y="1268" text-anchor="middle" class="codesm" style="font-size:22px">…</text>
  </g>

  <!-- footer -->
  <g id="footer">
    <line x1="175" y1="1350" x2="325" y2="1350" class="gold-stroke thin round"/>
    <circle cx="345" cy="1350" r="4" class="gold"/>
    <text x="500" y="1360" text-anchor="middle" class="subtitle" style="font-size:24px; font-style:italic;">Bridging logic and linked data</text>
    <circle cx="655" cy="1350" r="4" class="gold"/>
    <line x1="675" y1="1350" x2="825" y2="1350" class="gold-stroke thin round"/>
    <path d="M500 1390 L510 1400 L500 1410 L490 1400 Z" class="green"/>
  </g>
</svg>
