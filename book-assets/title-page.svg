<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1450" viewBox="0 0 1000 1450"
     role="img" aria-labelledby="title desc">

  <title id="title">The Art of WebEntail</title>
  <desc id="desc">
    Fully editable vector cover for The Art of WebEntail.
    The design uses text, paths, circles, lines, and rectangles only.
  </desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="100%" stop-color="#f4ead9"/>
    </linearGradient>

    <linearGradient id="archFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ead6a8"/>
      <stop offset="100%" stop-color="#caa66f"/>
    </linearGradient>


    <pattern id="dotField" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#2f7d63" opacity="0.16"/>
    </pattern>

    <style>
      .bg { fill: url(#paper); }

      .navy-fill { fill: #233a59; }
      .green-fill { fill: #2f7d63; }
      .wine-fill { fill: #94493f; }
      .gold-fill { fill: #b7904f; }

      .navy-stroke { stroke: #233a59; fill: none; }
      .green-stroke { stroke: #2f7d63; fill: none; }
      .wine-stroke { stroke: #94493f; fill: none; }
      .gold-stroke { stroke: #b7904f; fill: none; }

      .thin { stroke-width: 2; }
      .medium { stroke-width: 3.5; }
      .thick { stroke-width: 5; }
      .round { stroke-linecap: round; stroke-linejoin: round; }

      .title-small {
        fill: #233a59;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 64px;
        font-weight: 500;
        letter-spacing: 1px;
      }

      .title-main {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 116px;
        font-weight: 700;
        letter-spacing: -4px;
      }

      .subtitle {
        fill: #2f7d63;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
      }

      .author {
        fill: #94493f;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
      }

      .section-label {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .small-serif {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
      }

      .panel-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .code {
        fill: #233a59;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 18px;
      }

      .code-small {
        fill: #233a59;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
      }

      .label {
        fill: #233a59;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 21px;
      }

      .node {
        fill: #fffdf8;
        stroke: #233a59;
        stroke-width: 3;
      }

      .rdf-node {
        fill: #7da68d;
        stroke: #2f7d63;
        stroke-width: 3;
      }

      .panel {
        fill: #fffdf8;
        fill-opacity: 0.94;
        stroke-width: 3.5;
      }

      .soft-box {
        fill: #f4f7f1;
        stroke: #233a59;
        stroke-width: 2.4;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect id="background" width="1000" height="1450" class="bg"/>
  <rect x="0" y="0" width="1000" height="1450"
        fill="url(#dotField)" opacity="0.18"/>

  <!-- Header -->
  <g id="header">
    <text x="500" y="105" text-anchor="middle" class="title-small">
      The Art of
    </text>

    <text x="500" y="235" text-anchor="middle" class="title-main">
      <tspan fill="#233a59">Web</tspan><tspan fill="#94493f">Entail</tspan>
    </text>

    <line x1="110" y1="274" x2="445" y2="274"
          class="gold-stroke thin round"/>
    <path d="M500 265 L509 274 L500 283 L491 274 Z"
          fill="#b7904f"/>
    <line x1="555" y1="274" x2="890" y2="274"
          class="gold-stroke thin round"/>

    <text x="500" y="325" text-anchor="middle" class="subtitle">
      Standards-based relations, search, and explanations
    </text>

    <line x1="300" y1="372" x2="405" y2="372"
          class="gold-stroke thin round"/>
    <text x="500" y="381" text-anchor="middle" class="author">
      Author: Jos De Roo
    </text>
    <line x1="595" y1="372" x2="700" y2="372"
          class="gold-stroke thin round"/>
  </g>

  <!-- Hero labels -->
  <g id="hero-labels">
    <text x="210" y="455" text-anchor="middle"
          class="section-label wine-fill">RELATIONS</text>
    <text x="210" y="480" text-anchor="middle"
          class="small-serif wine-fill">(LOGIC)</text>

    <text x="790" y="455" text-anchor="middle"
          class="section-label green-fill">LINKED DATA</text>
    <text x="790" y="480" text-anchor="middle"
          class="small-serif green-fill">(RDF)</text>
  </g>

  <!-- Abstract bridge -->
  <g id="bridge">
    <!-- bridge arch -->
    <path d="M320 710
             C338 560, 410 500, 500 500
             C590 500, 662 560, 680 710"
          fill="none" stroke="url(#archFill)"
          stroke-width="62" stroke-linecap="round"/>

    <path d="M320 710
             C338 560, 410 500, 500 500
             C590 500, 662 560, 680 710"
          class="navy-stroke medium round"/>

    <!-- keystone -->
    <path d="M448 492 L552 492 L565 548 L435 548 Z"
          fill="#f0ddb5" stroke="#233a59" stroke-width="3"/>
    <text x="500" y="528" text-anchor="middle"
          class="section-label navy-fill"
          style="font-size:18px; letter-spacing:1px">
      ENTAILMENT
    </text>

    <!-- pillars -->
    <g id="left-pillar">
      <rect x="290" y="690" width="68" height="148"
            rx="7" fill="#ead6a8" stroke="#233a59" stroke-width="3"/>
      <rect x="278" y="676" width="92" height="22"
            rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
      <rect x="276" y="830" width="96" height="24"
            rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
      <line x1="306" y1="708" x2="306" y2="824"
            class="gold-stroke thin"/>
      <line x1="342" y1="708" x2="342" y2="824"
            class="gold-stroke thin"/>
    </g>

    <g id="right-pillar">
      <rect x="642" y="690" width="68" height="148"
            rx="7" fill="#ead6a8" stroke="#233a59" stroke-width="3"/>
      <rect x="630" y="676" width="92" height="22"
            rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
      <rect x="628" y="830" width="96" height="24"
            rx="5" fill="#d7ba7b" stroke="#233a59" stroke-width="3"/>
      <line x1="658" y1="708" x2="658" y2="824"
            class="gold-stroke thin"/>
      <line x1="694" y1="708" x2="694" y2="824"
            class="gold-stroke thin"/>
    </g>
  </g>

  <!-- Logic graph -->
  <g id="logic-graph">
    <line x1="145" y1="610" x2="210" y2="540"
          class="green-stroke medium round"/>
    <line x1="210" y1="540" x2="275" y2="610"
          class="green-stroke medium round"/>
    <line x1="145" y1="610" x2="275" y2="610"
          class="green-stroke medium round"/>

    <circle cx="210" cy="540" r="28" class="node"/>
    <circle cx="145" cy="610" r="28" class="node"/>
    <circle cx="275" cy="610" r="28" class="node"/>

    <text x="210" y="548" text-anchor="middle" class="label">a</text>
    <text x="145" y="618" text-anchor="middle" class="label">b</text>
    <text x="275" y="618" text-anchor="middle" class="label">c</text>
  </g>

  <!-- RDF graph -->
  <g id="rdf-graph">
    <line x1="735" y1="535" x2="805" y2="575"
          class="green-stroke medium round"/>
    <line x1="805" y1="575" x2="765" y2="640"
          class="green-stroke medium round"/>
    <line x1="805" y1="575" x2="875" y2="610"
          class="green-stroke medium round"/>
    <line x1="765" y1="640" x2="835" y2="690"
          class="green-stroke medium round"/>

    <circle cx="735" cy="535" r="17" class="rdf-node"/>
    <circle cx="805" cy="575" r="17" class="rdf-node"/>
    <circle cx="765" cy="640" r="17" class="rdf-node"/>
    <circle cx="875" cy="610" r="17" class="rdf-node"/>
    <circle cx="835" cy="690" r="17" class="rdf-node"/>

    <rect x="746" y="500" width="112" height="40" rx="8"
          fill="#fff8ea" stroke="#233a59" stroke-width="2"/>
    <text x="802" y="527" text-anchor="middle"
          class="small-serif navy-fill">ex:Alice</text>

    <rect x="855" y="558" width="116" height="40" rx="8"
          fill="#fff8ea" stroke="#233a59" stroke-width="2"/>
    <text x="913" y="585" text-anchor="middle"
          class="small-serif navy-fill">ex:knows</text>

    <rect x="846" y="682" width="104" height="40" rx="8"
          fill="#fff8ea" stroke="#233a59" stroke-width="2"/>
    <text x="898" y="709" text-anchor="middle"
          class="small-serif navy-fill">ex:Bob</text>
  </g>

  <!-- Proof tree inside bridge -->
  <g id="proof-tree">
    <circle cx="500" cy="590" r="18"
            fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="455" cy="660" r="18"
            fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="545" cy="660" r="18"
            fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="420" cy="730" r="18"
            fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="500" cy="730" r="18"
            fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
    <circle cx="580" cy="730" r="18"
            fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>

    <path d="M500 608 L455 642 M500 608 L545 642
             M455 678 L420 712 M455 678 L500 712
             M545 678 L580 712"
          class="green-stroke medium round"/>

    <line x1="500" y1="752" x2="500" y2="790"
          class="green-stroke medium round"
          stroke-dasharray="4 8"/>
    <path d="M491 785 L500 796 L509 785"
          class="green-stroke medium round"/>

    <circle cx="500" cy="824" r="29"
            fill="#2f7d63" stroke="#233a59" stroke-width="3"/>
    <path d="M486 825 L497 836 L516 810"
          fill="none" stroke="#fffdf8" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divider -->
  <g id="middle-divider">
    <line x1="70" y1="875" x2="930" y2="875"
          class="gold-stroke thin"/>
    <circle cx="500" cy="875" r="6" class="gold-fill"/>
  </g>

  <!-- Lower panels -->
  <g id="panels">
    <!-- panel 1 -->
    <g id="panel-relation">
      <rect x="52" y="925" width="275" height="360" rx="28"
            class="panel" stroke="#94493f"/>

      <circle cx="190" cy="925" r="38"
              fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
      <circle cx="190" cy="908" r="7"
              fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
      <circle cx="171" cy="942" r="7"
              fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
      <circle cx="209" cy="942" r="7"
              fill="#fffdf8" stroke="#94493f" stroke-width="3"/>
      <path d="M190 915 L171 935 M190 915 L209 935 M171 942 L209 942"
            class="wine-stroke medium round"/>

      <text x="190" y="992" text-anchor="middle"
            class="panel-title wine-fill">1. RELATION GRAPH</text>

      <line x1="110" y1="1030" x2="165" y2="1090"
            class="green-stroke medium round"/>
      <line x1="165" y1="1090" x2="230" y2="1050"
            class="green-stroke medium round"/>
      <line x1="230" y1="1050" x2="270" y2="1120"
            class="green-stroke medium round"
            stroke-dasharray="6 6"/>

      <circle cx="110" cy="1030" r="21" class="node"/>
      <circle cx="165" cy="1090" r="21" class="node"/>
      <circle cx="230" cy="1050" r="21" class="node"/>
      <circle cx="270" cy="1120" r="21" class="node"/>

      <text x="110" y="1037" text-anchor="middle" class="label">a</text>
      <text x="165" y="1097" text-anchor="middle" class="label">b</text>
      <text x="230" y="1057" text-anchor="middle" class="label">c</text>
      <text x="270" y="1127" text-anchor="middle" class="label">d</text>

      <text x="85" y="1180" class="code-small">path(a, b).</text>
      <text x="85" y="1210" class="code-small">path(b, c).</text>
      <text x="85" y="1240" class="code-small">edge(c, d).</text>
    </g>

    <!-- panel 2 -->
    <g id="panel-clauses">
      <rect x="362" y="925" width="276" height="360" rx="28"
            class="panel" stroke="#2f7d63"/>

      <circle cx="500" cy="925" r="38"
              fill="#fffdf8" stroke="#2f7d63" stroke-width="3"/>
      <text x="500" y="936" text-anchor="middle"
            class="code green-fill" style="font-size:28px">&lt;/&gt;</text>

      <text x="500" y="992" text-anchor="middle"
            class="panel-title green-fill" style="font-size:20px">2. EXECUTABLE CLAUSES</text>

      <text x="395" y="1050" class="code">path(X, Y) :-</text>
      <text x="425" y="1084" class="code">edge(X, Y).</text>

      <text x="395" y="1140" class="code">path(X, Y) :-</text>
      <text x="425" y="1174" class="code">edge(X, Z),</text>
      <text x="425" y="1208" class="code">path(Z, Y).</text>

      <rect x="390" y="1232" width="220" height="34" rx="7"
            fill="#f4f7f1" stroke="#2f7d63" stroke-width="2"/>
      <text x="500" y="1254" text-anchor="middle"
            class="code-small" style="font-size:10px">
        webentail --goal 'path(a, X)' program.pl
      </text>
    </g>

    <!-- panel 3 -->
    <g id="panel-proof">
      <rect x="673" y="925" width="275" height="360" rx="28"
            class="panel" stroke="#233a59"/>

      <circle cx="810" cy="925" r="38"
              fill="#fffdf8" stroke="#233a59" stroke-width="3"/>
      <rect x="802" y="903" width="16" height="12" rx="2"
            fill="#fffdf8" stroke="#233a59" stroke-width="2"/>
      <rect x="785" y="934" width="16" height="12" rx="2"
            fill="#fffdf8" stroke="#233a59" stroke-width="2"/>
      <rect x="819" y="934" width="16" height="12" rx="2"
            fill="#fffdf8" stroke="#233a59" stroke-width="2"/>
      <path d="M810 915 V926 M793 926 H827 M793 926 V934 M827 926 V934"
            class="navy-stroke thin round"/>

      <text x="810" y="992" text-anchor="middle"
            class="panel-title navy-fill">3. SYNTAX &amp; PROOFS</text>

      <rect x="755" y="1035" width="110" height="38" rx="8"
            class="soft-box"/>
      <text x="810" y="1060" text-anchor="middle"
            class="code-small">path(a, X)</text>

      <rect x="700" y="1120" width="104" height="38" rx="8"
            class="soft-box"/>
      <rect x="816" y="1120" width="104" height="38" rx="8"
            class="soft-box"/>
      <text x="752" y="1145" text-anchor="middle"
            class="code-small">edge(a,b)</text>
      <text x="868" y="1145" text-anchor="middle"
            class="code-small">path(b,X)</text>

      <rect x="790" y="1200" width="104" height="38" rx="8"
            class="soft-box"/>
      <text x="842" y="1225" text-anchor="middle"
            class="code-small">edge(b,c)</text>

      <path d="M810 1073 L752 1120 M810 1073 L868 1120
               M868 1158 L842 1200"
            class="navy-stroke medium round"/>
      <line x1="842" y1="1238" x2="842" y2="1260"
            class="navy-stroke thin round"
            stroke-dasharray="3 6"/>
    </g>
  </g>

  <!-- Footer -->
  <g id="footer">
    <line x1="175" y1="1350" x2="325" y2="1350"
          class="gold-stroke thin round"/>
    <circle cx="345" cy="1350" r="4" class="gold-fill"/>
    <text x="500" y="1360" text-anchor="middle"
          class="subtitle" style="font-size:24px; font-style:italic">
      Bridging logic and linked data
    </text>
    <circle cx="655" cy="1350" r="4" class="gold-fill"/>
    <line x1="675" y1="1350" x2="825" y2="1350"
          class="gold-stroke thin round"/>

    <path d="M500 1390 L510 1400 L500 1410 L490 1400 Z"
          fill="#2f7d63"/>
  </g>
</svg>
