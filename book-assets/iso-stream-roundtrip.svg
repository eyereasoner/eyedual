<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">A Prolog term round trip through a text stream</title>
  <desc id="desc">A structured event term is canonically written with a period, stored as text, read back with variable metadata, and followed to the end-of-stream state.</desc>
  <defs>
    <style>
      .bg{fill:#FFF9E8}.term{fill:#DDF7FB;stroke:#008EAA;stroke-width:2}.stream{fill:#DDF7FB;stroke:#537487;stroke-width:2}
      .file{fill:#FFFDF8;stroke:#17324D;stroke-width:2}.eof{fill:#FFF4BF;stroke:#E2BA22;stroke-width:2}
      .title{fill:#C8A100;font:bold 23px Georgia,serif}.label{fill:#17324D;font:bold 16px Georgia,serif}
      .code{fill:#102A3A;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.prose{fill:#405E70;font:15px Georgia,serif}
      .line{fill:none;stroke:#537487;stroke-width:2.5}.unit{fill:#FFFDF8;stroke:#537487;stroke-width:1.5}
    </style>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#537487"/></marker>
  </defs>
  <rect width="900" height="420" class="bg"/><text class="title" x="450" y="34" text-anchor="middle">TERM → TEXT STREAM → TERM</text>
  <rect class="term" x="20" y="125" width="190" height="105" rx="12"/><text class="code" x="115" y="156" text-anchor="middle">STRUCTURED TERM</text><text class="code" x="115" y="184" text-anchor="middle">event(sensor_7,</text><text class="code" x="115" y="207" text-anchor="middle">online)</text>
  <path class="line" marker-end="url(#a)" d="M210 177H258"/>

  <rect class="stream" x="258" y="80" width="382" height="190" rx="14"/><text class="label" x="449" y="112" text-anchor="middle">TEXT STREAM · ordered position</text>
  <g transform="translate(289 137)">
    <rect class="unit" x="0" width="40" height="45"/><rect class="unit" x="40" width="40" height="45"/><rect class="unit" x="80" width="40" height="45"/><rect class="unit" x="120" width="40" height="45"/><rect class="unit" x="160" width="40" height="45"/><rect class="unit" x="200" width="40" height="45"/><rect class="unit" x="240" width="40" height="45"/><rect class="unit" x="280" width="40" height="45"/>
    <text class="code" x="20" y="28" text-anchor="middle">e</text><text class="code" x="60" y="28" text-anchor="middle">v</text><text class="code" x="100" y="28" text-anchor="middle">e</text><text class="code" x="140" y="28" text-anchor="middle">n</text><text class="code" x="180" y="28" text-anchor="middle">t</text><text class="code" x="220" y="28" text-anchor="middle">(</text><text class="code" x="260" y="28" text-anchor="middle">…</text><text class="code" x="300" y="28" text-anchor="middle">.</text>
  </g>
  <text class="prose" x="449" y="211" text-anchor="middle">the period terminates one readable term</text>
  <text class="code" x="449" y="244" text-anchor="middle">open → write → close</text>

  <path class="line" marker-end="url(#a)" d="M640 177H690"/>
  <rect class="term" x="690" y="80" width="190" height="105" rx="12"/><text class="label" x="785" y="111" text-anchor="middle">READ TERM</text><text class="code" x="785" y="142" text-anchor="middle">event(sensor_7,</text><text class="code" x="785" y="165" text-anchor="middle">online)</text>
  <rect class="eof" x="690" y="215" width="190" height="70" rx="12"/><text class="label" x="785" y="244" text-anchor="middle">END STATE</text><text class="code" x="785" y="269" text-anchor="middle">end_of_file</text>

  <rect class="file" x="180" y="318" width="540" height="72" rx="10"/><text class="code" x="450" y="342" text-anchor="middle">open → read_term → end_of_file → close</text><text class="prose" x="450" y="367" text-anchor="middle">stream type · alias · position · metadata · EOF are explicit</text>
  <path class="line" marker-end="url(#a)" d="M785 185V210"/>
</svg>
